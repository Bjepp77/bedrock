<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0d0b">
<title>BEDROCK - Minimum-Dose Hypertrophy</title>
<style>
:root{--bg:#0c0d0b;--panel:#131511;--panel2:#181b15;--line:#2a2e24;--ink:#edf0e6;--dim:#a3ab95;--moss:#9dc88d;--moss2:#c4e3b6;--good:#7cf29c;--bad:#ff5d5d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:14px 12px 110px;background-image:radial-gradient(circle at 50% 0%, #18201399 0%, var(--bg) 65%)}
h1{font-size:22px;letter-spacing:2px;color:var(--moss);text-shadow:0 0 18px rgba(157,200,141,.3)}
.sub{color:var(--dim);font-size:12px;margin-top:2px}
.heroImg{height:190px;border-radius:14px;background:url('squat-bottom.jpg') center 38%/cover no-repeat;margin-top:12px;border:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.panel .pt{font-size:11px;letter-spacing:1.5px;color:var(--moss2);margin-bottom:6px}
.panel p{font-size:12px;color:var(--dim);line-height:1.7}
.daybtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;color:var(--ink);cursor:pointer}
.daybtn .dt{font-weight:700;font-size:15px}
.daybtn .dd{color:var(--dim);font-size:11px;margin-top:2px}
.daybtn .arrow{color:var(--moss);font-size:18px}
.daynum{font-size:10px;color:var(--moss2);letter-spacing:1.5px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.card .exname{font-weight:700;font-size:14px}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.chip.hot{color:var(--moss2);border-color:var(--moss)}
.setsrow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.setbtn{min-width:52px;padding:8px 6px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--dim);font-size:11px;text-align:center;cursor:pointer}
.setbtn.done{background:var(--moss);border-color:var(--moss);color:#0e1409;font-weight:700}
.setbtn .sr{font-size:9px;display:block;font-weight:400}
.logrow{display:flex;gap:6px;margin-top:8px}
.logrow input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px;font-size:13px;text-align:center;min-width:0}
.cue{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);color:var(--dim);font-size:11px;line-height:1.5}
.vlink{display:inline-block;margin-top:6px;font-size:11px;color:var(--moss2);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.varsel{width:100%;margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px;font-size:12px}
#timerbar{position:fixed;left:0;right:0;bottom:0;background:#101208;border-top:2px solid var(--moss);padding:10px 14px 16px;display:none;z-index:50}
#timerbar.on{display:block}
#tcount{font-size:30px;font-weight:800;color:var(--moss);text-align:center;font-variant-numeric:tabular-nums}
.tpresets{display:flex;gap:8px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.tpresets button{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
.tpresets button.on{border-color:var(--moss);color:var(--moss)}
#tlabel{text-align:center;color:var(--dim);font-size:11px;margin-top:2px}
.backlink{background:none;border:none;color:var(--dim);font-size:13px;text-decoration:underline;padding:12px;cursor:pointer}
.volnote{color:var(--dim);font-size:10px;margin-top:14px;line-height:1.5;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="timerbar">
  <div id="tcount">120</div>
  <div id="tlabel">REST - tap time to pause</div>
  <div class="tpresets">
    <button data-t="60">60s</button><button data-t="90">90s</button><button data-t="120" class="on">2:00</button><button data-t="180">3:00</button><button id="tstop">SKIP</button>
  </div>
</div>
<script>
/* ============ BEDROCK program data (original composition) ============ */
const DAYS = [
{id:'dayA', num:'DAY A', name:'SQUAT + PUSH/PULL', desc:'Full body, squat pattern', ex:[
  {n:'Back Squat (high bar)', sets:3, r:'6-10', rest:150, v:'backsquat', cue:'High bar, upright torso, full depth. The quad anchor for the week.', vars:['Back Squat (high bar)','Goblet Squat (home)']},
  {n:'Low Incline Dumbbell Press', sets:3, r:'8-12', rest:120, v:'inclinedb', cue:'Low incline, deep stretch, drive up. Chest gets its best compound today.', vars:['Low Incline Dumbbell Press','Feet-Elevated Push-Up (home)']},
  {n:'Seated Cable Row', sets:3, r:'10-12', rest:90, v:'cablerow', cue:'Chest tall, pull to the lower ribs, squeeze a full second.', vars:['Seated Cable Row','One-Arm Dumbbell Row']},
  {n:'Single-Arm Cable Lateral Raise', sets:2, r:'12-20', rest:60, v:'cablelatraise', cue:'On a minimalist plan side delts get no carryover - this slot is mandatory, not optional.', vars:['Single-Arm Cable Lateral Raise','Lean-Away DB Lateral Raise']},
  {n:'Lying Leg Curl', sets:2, r:'10-15', rest:90, v:'lyingcurl', cue:'Hips down, squeeze at the top, slow negative. Hams never ride on squats alone.', vars:['Lying Leg Curl','Sliding Leg Curl (home)']},
  {n:'Cable Rope Crunch', sets:2, r:'10-15', rest:60, v:'ropecrunch', cue:'Curl the spine, ribs to hips. Loadable flexion work for the abs.', vars:['Cable Rope Crunch','Bodyweight Crunch (home)']}]},
{id:'dayB', num:'DAY B', name:'HINGE + BARBELL DAY', desc:'Full body, deadlift pattern', ex:[
  {n:'Conventional Deadlift', sets:3, r:'5-8', rest:180, v:'deadlift', cue:'Push the floor away, hips and shoulders rise together, lock out tall. The one big hinge of the week.', vars:['Conventional Deadlift','Heavy KB/DB Deadlift (home)']},
  {n:'Flat Barbell Bench Press', sets:3, r:'6-10', rest:150, v:'benchpress', cue:'The barbell exposure day for chest. Upper back tight, bar to the lower chest.', vars:['Flat Barbell Bench Press','DB Floor Press (home)']},
  {n:'Pull-Up (weighted or assisted)', sets:3, r:'6-10', rest:120, v:'pullup', cue:'Dead hang to chin over bar. Add weight or assistance so every rep is clean. Vertical pull balances Day A.', vars:['Pull-Up (weighted or assisted)','Band-Assisted Pull-Up']},
  {n:'Seated Dumbbell Overhead Press', sets:2, r:'8-12', rest:120, v:'dbohp', cue:'Second press of the week keeps delts at 2x frequency.', vars:['Seated Dumbbell Overhead Press','Pike Push-Up (home)']},
  {n:'Leg Extension', sets:2, r:'10-15', rest:90, v:'legext', cue:'Second quad touch of the week. One-second squeeze at the top.', vars:['Leg Extension','Reverse Lunge (home)']},
  {n:'Standing Calf Raise', sets:2, r:'8-12', rest:60, v:'standingcalf', cue:'Full stretch, full squeeze. Calves get direct work on any honest plan.', vars:['Standing Calf Raise','Single-Leg Calf Raise (home)']}]},
{id:'dayC', num:'DAY C', name:'UNILATERAL + ARMS DAY', desc:'Full body, single-leg pattern', ex:[
  {n:'Bulgarian Split Squat', sets:3, r:'8-12 /leg', rest:120, v:'bulgarian', cue:'Third quad touch, lengthened position, one leg at a time. Long stride, drop straight down.', vars:['Bulgarian Split Squat','Split Squat (bodyweight, home)']},
  {n:'Chest-Focused Dips', sets:3, r:'8-15', rest:120, v:'dips', cue:'Lean forward, elbows flare slightly, deep stretch. Bodyweight pressing that actually loads the pecs.', vars:['Chest-Focused Dips','Bench Dips (home)']},
  {n:'Barbell Bent-Over Row', sets:3, r:'8-12', rest:120, v:'bentrow', cue:'The heavy horizontal pull of the week. Torso near parallel, pull to the belly.', vars:['Barbell Bent-Over Row','One-Arm Dumbbell Row']},
  {n:'Lean-Away DB Lateral Raise', sets:2, r:'12-20', rest:60, v:'dblatraise', cue:'Lean away from the anchor, raise to shoulder height. Second direct side-delt touch.', vars:['Lean-Away DB Lateral Raise','Standard DB Lateral Raise']},
  {n:'Romanian Deadlift', sets:2, r:'8-12', rest:120, v:'rdl', cue:'Second hinge touch at moderate load. Hips back, hamstrings loaded.', vars:['Romanian Deadlift','Single-Leg DB RDL (home)']},
  {n:'Ab Wheel Rollout', sets:2, r:'8-12', rest:90, v:'abwheel', cue:'Hips tucked, roll only as far as you can control. Anti-extension pairs with Day A flexion work.', vars:['Ab Wheel Rollout','Plank Walkout (home)']}]}
];
const RIR = '1-2 RIR';
/* videos: neutral third-party, high-production (filled from curated scrape) */
const VIDEOS = {
"abwheel":"https://www.youtube.com/watch?v=A3uK5TPzHq8",
"backext":"https://www.youtube.com/watch?v=-MTjHC3NC2s",
"backsquat":"https://www.youtube.com/watch?v=-bJIpOq-LWk",
"barbellcurl":"https://www.youtube.com/watch?v=ZQWL7omZh94",
"barbellohp":"https://www.youtube.com/watch?v=RoY7aG94X_Y",
"bayesiancurl":"https://www.youtube.com/watch?v=4O24gFksZ04",
"benchpress":"https://www.youtube.com/watch?v=rT7DgCr-3pg",
"bentrow":"https://www.youtube.com/watch?v=qXrTDQG1oUQ",
"bulgarian":"https://www.youtube.com/watch?v=hiLF_pF3EJM",
"cablelatraise":"https://www.youtube.com/watch?v=J-6uEOkYAKM",
"cablerow":"https://www.youtube.com/watch?v=vwHG9Jfu4sw",
"dbbench":"https://www.youtube.com/watch?v=O7ECGhZj_Hc",
"dblatraise":"https://www.youtube.com/watch?v=S7Bjyw2ccg0",
"dbohp":"https://www.youtube.com/watch?v=rO_iEImwHyo",
"deadlift":"https://www.youtube.com/watch?v=GxsLrTzyGUU",
"dips":"https://www.youtube.com/watch?v=wNDqWE_GnOw",
"ezcurl":"https://www.youtube.com/watch?v=kwG2ipFRgfo",
"facepull":"https://www.youtube.com/watch?v=WVq3JRs41dY",
"goblet":"https://www.youtube.com/watch?v=gCESNsDsbqk",
"hacksquat":"https://www.youtube.com/watch?v=0tn5K9NlCfo",
"hipthrust":"https://www.youtube.com/watch?v=5S8SApGU_Lk",
"inclinedb":"https://www.youtube.com/watch?v=IP4oeKh1Sd4",
"latraise":"https://www.youtube.com/watch?v=NNAs8jx_zJI",
"legext":"https://www.youtube.com/watch?v=YyvSfVjQeL0",
"lyingcurl":"https://www.youtube.com/watch?v=jxctD6fL_FQ",
"machpress":"https://www.youtube.com/watch?v=3R14MnZbcpw",
"pallof":"https://www.youtube.com/watch?v=QGrE4L2o4J0",
"pullup":"https://www.youtube.com/watch?v=gx0RWT7WbmA",
"pushdown":"https://www.youtube.com/watch?v=n2FSCB4vRSA",
"rdl":"https://www.youtube.com/watch?v=7j-2w4-P14I",
"revpecdeck":"https://www.youtube.com/watch?v=v0rJuhEa59c",
"ropecrunch":"https://www.youtube.com/watch?v=jBtiDLz0y7s",
"sealrow":"https://www.youtube.com/watch?v=tvk5Fb2K0Ns",
"seatedcalf":"https://www.youtube.com/watch?v=BxfKOyI8sUg",
"seatedcurl":"https://www.youtube.com/watch?v=t9sTSr-JYSs",
"skullcrusher":"https://www.youtube.com/watch?v=NIWKqcmpBug",
"standingcalf":"https://www.youtube.com/watch?v=Km0QS46bTEA",
"straightarm":"https://www.youtube.com/watch?v=WDOV2PDpkiU",
"yraise":"https://www.youtube.com/watch?v=oDSGrucETfw"
};
const LS_KEY = 'forge.bedrock.v1';

/* ============ state ============ */
function load(){try{return JSON.parse(localStorage.getItem(LS_KEY))||{}}catch(e){return{}}}
function save(s){localStorage.setItem(LS_KEY,JSON.stringify(s))}
let S = load();
function dayLog(did){S.days=S.days||{};S.days[did]=S.days[did]||{};return S.days[did]}

/* ============ views ============ */
const app=document.getElementById('app');
function home(){
  app.innerHTML='<h1>BEDROCK</h1><div class="sub">MINIMUM-DOSE HYPERTROPHY - the least you can do and still grow</div>'
  +'<div class="heroImg"></div>'
  +'<div class="panel"><div class="pt">HOW IT RUNS</div><p>Three days a week, at least one rest day between - Mon/Wed/Fri works. Every set: '+RIR+'. When every set tops the rep range, add weight next time. Every lift has a home swap in the dropdown - no gym, no excuse.</p></div>'
  + DAYS.map((d,i)=>'<button class="daybtn" data-i="'+i+'"><div><div class="daynum">'+d.num+'</div><div class="dt">'+d.name+'</div><div class="dd">'+d.desc+'</div></div><span class="arrow">&#9654;</span></button>').join('')
  +'<div class="volnote">6-9 direct sets per muscle per week, each muscle touched 2-3x. Enough, not junk.<br>45-60 minutes a session. Done is the goal.</div>';
  app.querySelectorAll('.daybtn').forEach(b=>b.onclick=()=>day(+b.dataset.i));
}
function day(i){
  const d=DAYS[i];
  const log=dayLog(d.id);
  let h='<h1>'+d.name+'</h1><div class="sub">'+d.num+' - '+d.desc+' - '+RIR+'</div>';
  d.ex.forEach((ex,xi)=>{
    const key='x'+xi;
    const done=(log[key]&&log[key].sets)||[];
    const varName=(log[key]&&log[key].varName)||ex.n;
    h+='<div class="card"><div><span class="exname">'+varName+'</span></div>'
    +'<div class="chips"><span class="chip hot">'+ex.sets+' x '+ex.r+' REPS</span><span class="chip">'+RIR+'</span><span class="chip">REST '+(ex.rest>=120?(ex.rest/60)+' MIN':ex.rest+'s')+'</span></div>'
    +'<div class="setsrow">'+Array.from({length:ex.sets},(_,s)=>'<button class="setbtn'+(done[s]?' done':'')+'" data-k="'+key+'" data-s="'+s+'" data-r="'+ex.rest+'">SET '+(s+1)+'<span class="sr">'+(done[s]?done[s].w+'x'+done[s].r:'tap')+'</span></button>').join('')+'</div>'
    +'<div class="logrow"><input id="w-'+key+'" inputmode="decimal" placeholder="lb"><input id="r-'+key+'" inputmode="numeric" placeholder="reps"></div>'
    +(ex.vars?'<select class="varsel" data-k="'+key+'">'+ex.vars.map(v=>'<option'+(v===varName?' selected':'')+'>'+v+'</option>').join('')+'</select>':'')
    +'<div class="cue">'+ex.cue+'</div>'
    +(VIDEOS[ex.v]?'<a class="vlink" href="'+VIDEOS[ex.v]+'" target="_blank" rel="noopener">&#9654; FORM VIDEO</a>':'')
    +'</div>';
  });
  h+='<div style="text-align:center"><button class="backlink" id="bk">&lt; BACK TO DAYS</button></div>';
  app.innerHTML=h;
  document.getElementById('bk').onclick=home;
  app.querySelectorAll('.setbtn').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, s=+b.dataset.s;
    log[k]=log[k]||{sets:[]};
    if(log[k].sets[s]){delete log[k].sets[s];}
    else{
      const w=parseFloat(document.getElementById('w-'+k).value)||0;
      const r=parseInt(document.getElementById('r-'+k).value)||0;
      log[k].sets[s]={w:w,r:r};
    }
    save(S); startTimer(+b.dataset.r); day(i);
  });
  app.querySelectorAll('.varsel').forEach(sel=>sel.onchange=()=>{
    const k=sel.dataset.k; log[k]=log[k]||{sets:[]}; log[k].varName=sel.value; save(S);
  });
}

/* ============ rest timer ============ */
let tInt=null,tLeft=120;
function startTimer(sec){
  tLeft=sec; const bar=document.getElementById('timerbar');bar.classList.add('on');
  clearInterval(tInt); tick();
  tInt=setInterval(()=>{tLeft--; tick(); if(tLeft<=0){clearInterval(tInt); bar.classList.remove('on'); if(navigator.vibrate)navigator.vibrate(200);}},1000);
}
function tick(){const m=Math.floor(tLeft/60),s=tLeft%60;document.getElementById('tcount').textContent=(tLeft>=60)?m+':'+String(s).padStart(2,'0'):tLeft;}
document.querySelectorAll('.tpresets button[data-t]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tpresets button[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');startTimer(+b.dataset.t);
});
document.getElementById('tstop').onclick=()=>{clearInterval(tInt);document.getElementById('timerbar').classList.remove('on');};
document.getElementById('tcount').onclick=()=>{if(tInt){clearInterval(tInt);tInt=null;}else if(tLeft>0){startTimer(tLeft);}};

home();
</script>
</body>
</html>
